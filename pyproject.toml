[project]
name = "qae-options"
version = "0.1.0"
description = "Option pricing with quantum amplitude estimation: QAE, IQAE and MLAE vs Monte Carlo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiskit",
    "qiskit-aer",
    "qiskit-algorithms",
    # Fake IBM backends (FakeSherbrooke, ...) for noisy_simulator() ship only in this package.
    "qiskit-ibm-runtime",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "rich",
]

[project.scripts]
qae-options = "qae_options.cli:main"
qae-demo = "qae_options.demo:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# qcc_common: simulator backends, circuit metrics, experiment records, plotting, parallel map.
packages = ["src/qae_options", "src/qcc_common"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["qcc_common", "qae_options"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["slow: long-running simulation tests (deselect with -m 'not slow')"]
