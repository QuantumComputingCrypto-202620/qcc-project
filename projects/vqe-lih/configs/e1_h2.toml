# E1: pipeline validation on H2 (STO-3G, JW, 4 qubits), UCCSD + COBYLA from HF at every point.
experiment = "e1"
molecule = "H2"
basis = "sto3g"
mapper = "jordan_wigner"
bond_lengths = [0.3, 0.4, 0.5, 0.6, 0.7, 0.735, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.8, 2.0, 2.2, 2.5]
warm_start = false
seed = 100

[optimizer]
name = "cobyla"
maxiter = 1000

[[ansatze]]
type = "uccsd"
