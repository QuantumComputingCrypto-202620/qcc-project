[project]
name = "qcc-common"
version = "0.1.0"
description = "Shared backends, circuit metrics, experiment records and plotting for qcc-project."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "qiskit",
    "qiskit-aer",
    # Fake IBM backends (FakeSherbrooke, ...) for noisy_simulator() ship only in this package.
    "qiskit-ibm-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
